[project]
name = "open-nla-audits"
version = "0.1.0"
description = "Unofficial research: auditing hidden objectives with open Natural Language Autoencoders (NLAs)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "transformers>=5.0,<6",
    "accelerate>=1.0",
    "datasets>=2.20",
    "torch>=2.4",
    "wandb>=0.17",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nla_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # NLA injection chars are intentional CJK

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet (downloads the Qwen tokenizer from the HF Hub)",
]
