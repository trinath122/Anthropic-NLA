# Free LLM providers, all reached through ONE OpenAI-compatible client
# (src/nla_audit/llm_client.py). Model names and free-tier limits change often:
# run `make check-providers` on day 1 and update this file from what it reports.
#
# Policy enforced in code (amendments 4 + 5 of the plan):
#   * role "gen"   (data that trains a model) -> only models whose licence is in
#                   gen_allowed_licences (Apache/MIT open weights). Never Gemini, never Llama.
#   * role "judge" -> must come from a model FAMILY that never appears in the gen chain.
#   * every call (cached or not) is appended to the ledger with provider + model + role.

cache_path: cache/llm_cache.sqlite
ledger_path: cache/llm_ledger.jsonl

gen_allowed_licences: [apache-2.0, mit]

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    requests_per_minute: 30
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 10
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    requests_per_minute: 20

# family + licence per model. "licence" here means: may outputs of this model be
# used as TRAINING DATA under its terms? (Gemini API terms: no.)
# Verified 2026-11-25 with `make check-providers` + HF model cards (gpt-oss, Qwen3.8: apache-2.0).
# Cerebras dropped (requires a card). Groq no longer serves llama-3.3 / qwen3-32b;
# Gemini 2.5 flash models 404 on generation.
models:
  groq/openai/gpt-oss-120b:         { family: gpt-oss, licence: apache-2.0 }
  groq/qwen/qwen3.8-27b:            { family: qwen3, licence: apache-2.0 }
  groq/openai/gpt-oss-20b:          { family: gpt-oss, licence: apache-2.0 }
  gemini/gemini-3.5-flash:          { family: gemini, licence: gemini-api-terms }
  gemini/gemini-3.5-flash-lite:     { family: gemini, licence: gemini-api-terms }
  "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free": { family: nemotron, licence: nvidia-open-model }

# Ordered fallback chains per role.
roles:
  gen:
    - groq/openai/gpt-oss-120b
    - groq/qwen/qwen3.8-27b
    - groq/openai/gpt-oss-20b
  judge:
    - gemini/gemini-3.5-flash
    - "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    - gemini/gemini-3.5-flash-lite

retry:
  max_attempts_per_model: 5
  base_delay_s: 2.0
  max_delay_s: 120.0
